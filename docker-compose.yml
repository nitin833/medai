services:
  # ----------------------------------------------------
  # Qdrant Vector Database
  # ----------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medai_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ----------------------------------------------------
  # Streamlit Web UI
  # ----------------------------------------------------
  medai-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: medai:latest
    container_name: medai_streamlit
    command: streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------
  # FastAPI REST Backend
  # ----------------------------------------------------
  medai-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: medai:latest
    container_name: medai_fastapi
    command: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  qdrant_data:
